plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

base {
    archivesName = 'opsucht-chat-neoforge-mc26.2'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.java.srcDir rootProject.file('minecraft/26.2/java')
sourceSets.main.resources.srcDir rootProject.file('minecraft/26.2/resources')

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
    }

    mods {
        opsucht_chat {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    include {
        transitive = false
    }
}

dependencies {
    implementation project(':core')
    include project(':core')
}

tasks.named('jar') {
    dependsOn ':core:jar'
    from {
        configurations.include.collect { zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            neoforge_version : neoforge_version,
            mod_version      : project.version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

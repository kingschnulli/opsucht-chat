plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

base {
    archivesName = 'opsucht-chat-fabric-mc26.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

sourceSets.main.java.srcDir rootProject.file('minecraft/26.2/java')
sourceSets.main.resources.srcDir rootProject.file('minecraft/26.2/resources')

configurations {
    include {
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation project(':core')
    include project(':core')
}

loom {
    mods {
        opsucht_chat {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.named('jar') {
    dependsOn ':core:jar'
    from {
        configurations.include.collect { zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

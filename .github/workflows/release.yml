name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix, e.g. 0.1.0-alpha.1'
        required: true
        type: string
      prerelease:
        description: 'Publish as pre-release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve version
        id: meta
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${MANUAL_VERSION#v}"
            TAG="v${VERSION}"
            PRERELEASE="${MANUAL_PRERELEASE:-false}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [[ "${VERSION}" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  core:
    name: Core tests
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          gradle-version: '9.2.1'

      - name: Test core
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: gradle --no-daemon --configure-on-demand :core:test

  fabric:
    name: Fabric 26.2
    needs: [meta, core]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle for Fabric Loom
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          gradle-version: '9.7.1'

      - name: Build Fabric release
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: gradle --no-daemon --configure-on-demand :platforms:fabric:build

      - name: Collect Fabric JAR
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="$(find platforms/fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1)"
          test -n "$JAR" && test -f "$JAR"
          cp "$JAR" "dist/opsucht-chat-${VERSION}-fabric-mc26.2.jar"

      - name: Upload Fabric release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-fabric
          path: dist/*.jar
          if-no-files-found: error

  neoforge:
    name: NeoForge 26.2
    needs: [meta, core]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle for NeoForge
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          gradle-version: '9.2.1'

      - name: Build NeoForge release
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: gradle --no-daemon --configure-on-demand :platforms:neoforge:build

      - name: Collect NeoForge JAR
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="$(find platforms/neoforge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | sort | head -n 1)"
          test -n "$JAR" && test -f "$JAR"
          cp "$JAR" "dist/opsucht-chat-${VERSION}-neoforge-mc26.2.jar"

      - name: Upload NeoForge release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-neoforge
          path: dist/*.jar
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [meta, fabric, neoforge]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          ls -lah dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          PRERELEASE_ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Opsucht Chat $VERSION" \
              --generate-notes \
              "${PRERELEASE_ARGS[@]}"
          fi
